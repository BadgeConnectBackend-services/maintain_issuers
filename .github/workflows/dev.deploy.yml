name: Maintain Issuers Dev Deploy

on:
  push:
    tags:
      - "issuer-dev-v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.ref_name }}

          docker build -t rajsondhiya/maintain_issuers:$IMAGE_TAG .
          docker push rajsondhiya/maintain_issuers:$IMAGE_TAG

      - name: Deploy to EC2 (DEV)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE_TAG=${{ github.ref_name }}

            cd ~/services

            docker pull rajsondhiya/maintain_issuers:$IMAGE_TAG

            docker tag rajsondhiya/maintain_issuers:$IMAGE_TAG rajsondhiya/maintain_issuers:latest

            docker compose up -d --force-recreate --remove-orphans maintain_issuers

            docker image prune -f
