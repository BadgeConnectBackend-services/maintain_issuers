# Use this file to push only for main branch and production instance.
# always switch to main branch before pushing to production.

name: Maintain Issuers Production Deploy

on:
  push:
    tags:
      - "issuer-v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          set -e
          IMAGE_TAG=${{ github.ref_name }}

          docker build -t cloudstry2026/maintain_issuers:$IMAGE_TAG .
          docker push cloudstry2026/maintain_issuers:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE_TAG=${{ github.ref_name }}

            cd ~/badgeconnect

            docker pull cloudstry2026/maintain_issuers:$IMAGE_TAG

            docker tag cloudstry2026/maintain_issuers:$IMAGE_TAG cloudstry2026/maintain_issuers:latest

            docker compose up -d --force-recreate --remove-orphans maintain_issuers

            docker image prune -f
